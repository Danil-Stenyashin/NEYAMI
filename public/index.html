<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NEYAMI</title>
  <meta name="description" content="Свободная музыка и волна, которая слышит звук и объясняет каждую рекомендацию">
  <meta name="theme-color" content="#0e0e11">
  <!-- iPhone: запуск с экрана «Домой» как отдельное приложение -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NEYAMI">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <a class="logo" href="#/wave">NEYAMI</a>
    <nav>
      <a href="#/wave" data-nav="wave">Волна</a>
      <a href="#/quick" data-nav="quick">⚡ Быстрый поиск</a>
      <a href="#/new" data-nav="new">Новое</a>
      <a href="#/following" data-nav="following">Подписки</a>
      <a href="#/likes" data-nav="likes">Мне нравится</a>
      <a href="#/upload" data-nav="upload">Загрузить</a>
    </nav>
    <form id="search" class="search"><input name="q" type="search" placeholder="Треки, артисты, #теги"></form>
    <div id="account" class="account"></div>
  </header>

  <div id="offline" class="offline hidden">
    Нет связи с сервером NEYAMI. Проверьте, что он запущен на компьютере и телефон в той же Wi-Fi сети. Переподключаюсь…
  </div>
  <main id="view"></main>

  <footer id="player" class="player hidden">
    <div class="p-info">
      <div class="p-title" id="p-title"></div>
      <div class="p-artist" id="p-artist"></div>
    </div>
    <div class="p-controls">
      <button id="p-dislike" title="Не то (волна учтёт)">👎</button>
      <button id="p-toggle" class="big" title="Пауза / играть">▶</button>
      <button id="p-next" title="Дальше">⏭</button>
      <button id="p-like" title="Нравится">♡</button>
      <button id="p-drop" title="К лучшему моменту">⤓</button>
    </div>
    <div class="p-progress">
      <span id="p-time">0:00</span>
      <div class="seek-wrap">
        <canvas id="p-heat" title="Где слушают чаще всего; выделен лучший момент"></canvas>
        <input id="p-seek" type="range" min="0" max="1000" value="0">
      </div>
      <span id="p-dur">0:00</span>
    </div>
    <div class="p-reasons" id="p-reasons"></div>
  </footer>

  <audio id="audio" preload="auto"></audio>
  <div id="toast" class="toast"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
