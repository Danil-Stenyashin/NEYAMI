<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NEYAMI</title>
  <meta name="description" content="Свободная музыка и волна, которая слышит звук и объясняет каждую рекомендацию">
  <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
  <!-- iPhone: запуск с экрана «Домой» как отдельное приложение -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NEYAMI">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <a class="brand logo" href="#/wave"><img src="/icons/icon.svg" alt=""><span>neyami</span></a>
      <form id="search" class="search" role="search">
        <span data-icon="search" data-size="16"></span>
        <input name="q" type="search" placeholder="Поиск" aria-label="Поиск треков, артистов и тегов">
      </form>
      <nav>
        <a href="#/wave" data-nav="wave"><span data-icon="wave"></span>Моя волна</a>
        <a href="#/quick" data-nav="quick"><span data-icon="zap"></span>Быстрый поиск</a>
        <a href="#/new" data-nav="new"><span data-icon="clock"></span>Новое</a>
        <a href="#/following" data-nav="following"><span data-icon="users"></span>Подписки</a>
        <a href="#/likes" data-nav="likes"><span data-icon="heart"></span>Мне нравится</a>
        <a href="#/taste" data-nav="taste"><span data-icon="compass"></span>Мой вкус</a>
        <a href="#/upload" data-nav="upload"><span data-icon="plus"></span>Добавить музыку</a>
      </nav>
      <div id="account" class="account"></div>
    </aside>

    <div class="main">
      <div id="offline" class="offline hidden">
        Нет связи с сервером NEYAMI. Проверьте, что он запущен на компьютере и телефон в той же Wi-Fi сети. Переподключаюсь…
      </div>
      <main id="view"></main>
    </div>
  </div>

  <footer id="player" class="player hidden">
    <div class="p-info" id="p-open" title="Открыть большой плеер">
      <img id="p-cover" class="p-cover" alt="">
      <div class="p-text">
        <div class="p-title" id="p-title"></div>
        <div class="p-artist" id="p-artist"></div>
      </div>
    </div>
    <div class="p-controls">
      <button id="p-dislike" class="icon-btn" title="Не то — волна учтёт" data-icon="dislike"></button>
      <button id="p-like" class="icon-btn" title="Нравится" data-icon="heart"></button>
      <button id="p-toggle" class="big" title="Пауза / играть" data-icon="play"></button>
      <button id="p-next" class="icon-btn" title="Дальше" data-icon="next"></button>
      <button id="p-drop" class="icon-btn" title="К лучшему моменту" data-icon="target"></button>
    </div>
    <div class="p-progress">
      <span id="p-time">0:00</span>
      <div class="seek-wrap">
        <canvas id="p-heat" title="Где слушают чаще всего; отмечен лучший момент"></canvas>
        <input id="p-seek" type="range" min="0" max="1000" value="0" aria-label="Перемотка">
      </div>
      <span id="p-dur">0:00</span>
    </div>
    <div class="p-reasons" id="p-reasons"></div>
  </footer>

  <!-- Большой плеер: обложка, «живой» звук, эквалайзер -->
  <div id="full" class="full hidden" role="dialog" aria-label="Сейчас играет">
    <button id="full-close" class="icon-btn full-close" title="Свернуть (Esc)" data-icon="x"></button>
    <div class="full-inner">
      <div class="full-art">
        <img id="full-cover" alt="">
        <canvas id="full-viz" aria-hidden="true"></canvas>
      </div>
      <div class="full-side">
        <div class="full-title" id="full-title"></div>
        <div class="full-artist" id="full-artist"></div>
        <div class="full-why" id="full-why"></div>
        <div class="full-seek">
          <span id="full-time">0:00</span>
          <input id="full-range" type="range" min="0" max="1000" value="0" aria-label="Перемотка">
          <span id="full-dur">0:00</span>
        </div>
        <div class="full-controls">
          <button class="icon-btn" data-proxy="#p-dislike" title="Не то" data-icon="dislike"></button>
          <button class="icon-btn" id="full-like" data-proxy="#p-like" title="Нравится" data-icon="heart"></button>
          <button class="big" id="full-toggle" data-proxy="#p-toggle" title="Играть / пауза" data-icon="play"></button>
          <button class="icon-btn" data-proxy="#p-next" title="Дальше" data-icon="next"></button>
          <button class="icon-btn" data-proxy="#p-drop" title="К лучшему моменту" data-icon="target"></button>
        </div>
        <button id="eq-toggle" class="ghost eq-toggle">Эквалайзер</button>
        <div id="eq-panel" class="eq hidden"></div>
        <div class="full-source" id="full-source"></div>
      </div>
    </div>
  </div>

  <audio id="audio" preload="auto"></audio>
  <div id="toast" class="toast"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
